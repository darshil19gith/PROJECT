    const { useState, useEffect } = React;
 const API_BASE = 'https://krishisetu-caae.onrender.com';

    // All frontend API calls go through the deployed backend.
    // This prevents Vercel/static-host relative URLs such as /api/create-lot
    // from incorrectly hitting the frontend host and returning 404.
    const apiUrl = (path) => `${API_BASE}${path.startsWith('/') ? path : `/${path}`}`;

    const apiRequest = async (path, options = {}) => {
      const response = await fetch(apiUrl(path), {
        ...options,
        headers: {
          Accept: 'application/json',
          ...(options.body ? { 'Content-Type': 'application/json' } : {}),
          ...(options.headers || {})
        }
      });

      const contentType = response.headers.get('content-type') || '';
      const raw = await response.text();
      let data = null;

      if (raw) {
        if (contentType.includes('application/json')) {
          try {
            data = JSON.parse(raw);
          } catch (_) {
            throw new Error(`Backend returned invalid JSON (${response.status}).`);
          }
        } else {
          throw new Error(`Backend returned ${response.status} ${response.statusText} instead of JSON.`);
        }
      }

      if (!response.ok) {
        throw new Error(
          (data && (data.message || data.error)) ||
          `Request failed: ${response.status} ${response.statusText}`
        );
      }

      return data || {};
    };

          const utterance = new SpeechSynthesisUtterance(text);
          utterance.lang = langCode === 'hi' ? 'hi-IN' : langCode === 'mr' ? 'mr-IN' : 'en-US';
          utterance.rate = 0.9;
          utterance.onstart = () => setIsSpeaking(true);
          utterance.onend = () => setIsSpeaking(false);
          utterance.onerror = () => setIsSpeaking(false);
          window.speechSynthesis.speak(utterance);

        }
      };

        } else if (language === 'mr') {
          msg = `कृषिसितू सल्ला: ${selectedForecastCrop} साठी वखारीत साठवणूक करा. निव्वळ नफा प्रति क्विंटल ₹340 अधिक मिळेल.`;

          setMandiComparisons(marketData.mandiComparisons || []);
          setLogisticsDispatches(marketData.logisticsDispatches || []);

          setStorageBookings(lotData.storageBookings || []);

          unit: form.unit.value,

          method: 'POST',

            fetchData();

      // DYNAMIC SVG CHART SCALE CALCULATOR
      const renderForecastSvg = () => {
        if (!forecastData || !forecastData.prices || forecastData.prices.length === 0) return null;

        const prices = forecastData.prices;
        const minP = Math.min(...prices);
        const maxP = Math.max(...prices);
        const rangeP = (maxP - minP) || 1;

        const points = prices.map((p, idx) => {
          const cx = 35 + idx * 72;
          const cy = 120 - ((p - minP) / rangeP) * 90;
          return { cx, cy, price: p, day: forecastData.days[idx] };
        });

        const pathD = `M ${points.map(pt => `${pt.cx} ${pt.cy}`).join(' L ')}`;

        return (

                </g>
              ))}
            </svg>
          </div>
        );

                    <label class="block text-xs font-black uppercase text-gray-500 mb-1">Select Warehouse Facility</label>
                    <select name="warehouse" class="w-full p-3.5 border border-gray-300 rounded-xl font-bold">
                      <option value="Apex Warehousing & ColdStorage (Nashik Hub)">Apex Warehousing & ColdStorage (Nashik Hub)</option>
                      <option value="MahaAgri State Cold Store (Pune)">MahaAgri State Cold Store (Pune)</option>
                    </select>
                  </div>

                  <div class="grid grid-cols-2 gap-3">
                    <div>
                      <label class="block text-xs font-black uppercase text-gray-500 mb-1">Commodity</label>
                      <input type="text" name="crop" defaultValue="Onion" class="w-full p-3.5 border border-gray-300 rounded-xl font-bold" />
                    </div>
                    <div>
                      <label class="block text-xs font-black uppercase text-gray-500 mb-1">Quantity (qtl)</label>
                      <input type="number" name="qty" defaultValue="100" class="w-full p-3.5 border border-gray-300 rounded-xl font-bold" />
                    </div>
                  </div>

                  <div>
                    <label class="block text-xs font-black uppercase text-gray-500 mb-1">Holding Duration (Days)</label>
                    <input type="number" name="duration" defaultValue="30" class="w-full p-3.5 border border-gray-300 rounded-xl font-bold" />
                  </div>

                  <button type="submit" class="w-full bg-agri-600 hover:bg-agri-700 text-white font-extrabold py-4 rounded-full shadow-lg text-base">
                    ✅ Reserve Warehouse Storage Slot
                  </button>
                </form>
              </div>
            </div>
          )}

          {/* 5. QUALITY CERTIFICATE MODAL */}
          {showQualityCertModal && (
            <div class="fixed inset-0 z-50 bg-black/60 backdrop-blur-sm flex items-center justify-center p-4">
              <div class="bg-white rounded-3xl max-w-lg w-full p-8 shadow-2xl space-y-6 relative">
                <button onClick={() => setShowQualityCertModal(false)} class="absolute top-6 right-6 text-2xl text-gray-400 hover:text-gray-700">✕</button>
                
                <h3 class="text-2xl font-black text-gray-900">🔬 Issue Digital Quality Certificate</h3>
                
                <form onSubmit={handleIssueQualityCert} class="space-y-4">
                  <div>
                    <label class="block text-xs font-black uppercase text-gray-500 mb-1">Target Lot ID</label>
                    <input type="text" name="lotId" defaultValue="LOT-1082" class="w-full p-3.5 border border-gray-300 rounded-xl font-bold" />
                  </div>

                  <div class="grid grid-cols-2 gap-3">
                    <div>
                      <label class="block text-xs font-black uppercase text-gray-500 mb-1">Moisture %</label>
                      <input type="text" name="moisture" defaultValue="11.2" class="w-full p-3.5 border border-gray-300 rounded-xl font-bold" />
                    </div>
                    <div>
                      <label class="block text-xs font-black uppercase text-gray-500 mb-1">Foreign Matter %</label>
                      <input type="text" name="foreignMatter" defaultValue="0.4" class="w-full p-3.5 border border-gray-300 rounded-xl font-bold" />
                    </div>
                  </div>

                  <div>
                    <label class="block text-xs font-black uppercase text-gray-500 mb-1">Assigned Grade</label>
                    <select name="grade" class="w-full p-3.5 border border-gray-300 rounded-xl font-bold">
                      <option value="Grade A+">Grade A+ (Premium Export)</option>
                      <option value="Grade A">Grade A (Standard)</option>
                      <option value="Grade B">Grade B (Processing)</option>
                    </select>
                  </div>

                  <button type="submit" class="w-full bg-agri-600 hover:bg-agri-700 text-white font-extrabold py-4 rounded-full shadow-lg text-base">
                    📜 Generate Signed Certificate
                  </button>
                </form>
              </div>
            </div>
          )}

          {/* 6. MAKE OFFER MODAL */}
          {showOfferModal && selectedLotForOffer && (
            <div class="fixed inset-0 z-50 bg-black/60 backdrop-blur-sm flex items-center justify-center p-4">
              <div class="bg-white rounded-3xl max-w-lg w-full p-8 shadow-2xl space-y-6 relative">
                <button onClick={() => setShowOfferModal(false)} class="absolute top-6 right-6 text-2xl text-gray-400 hover:text-gray-700">✕</button>
                
                <h3 class="text-2xl font-black text-gray-900">🤝 Make Purchase Offer for {selectedLotForOffer.id}</h3>
                <div class="text-xs text-gray-500 font-bold">Crop: {selectedLotForOffer.crop} • Qty: {selectedLotForOffer.qty} {selectedLotForOffer.unit}</div>

                <form onSubmit={handleMakeOffer} class="space-y-4">
                  <div>
                    <label class="block text-xs font-black uppercase text-gray-500 mb-1">Offered Price (₹/qtl)</label>
                    <input type="number" name="offeredPrice" defaultValue={selectedLotForOffer.expectedPrice} class="w-full p-3.5 border border-gray-300 rounded-xl font-bold text-xl text-agri-600" />
                  </div>

                  <button type="submit" class="w-full bg-harvest-500 hover:bg-harvest-600 text-harvest-900 font-extrabold py-4 rounded-full shadow-lg text-base">
                    🚀 Submit Purchase Offer to Farmer
                  </button>
                </form>
              </div>
            </div>
          )}

          {/* FOOTER */}
          <footer class="bg-white border-t border-gray-200 py-8 text-center text-xs font-bold text-gray-400">
            Smart India Hackathon 2026 • Team Code Catalyst • KrishiSetu Platform
          </footer>

        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
