<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>KrishiSetu | Smart Market Intelligence & Role Dashboard</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=Noto+Sans+Devanagari:wght@400;600;700;800&display=swap" rel="stylesheet">
  
  <script src="https://cdn.tailwindcss.com"></script>
  <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
</head>
<body class="min-h-screen bg-[#FAFAF7]">

  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect } = React;

    function App() {
      const params = new URLSearchParams(window.location.search);
      const initialRole = params.get('role') || 'farmer';

      const [currentRole, setCurrentRole] = useState(initialRole);
      const [selectedCrop, setSelectedCrop] = useState('Onion (Nashik Red)');
      const [forecastData, setForecastData] = useState(null);
      const [mandiComparisons, setMandiComparisons] = useState([]);

      useEffect(() => {
        fetch('/api/market-data')
          .then(res => res.json())
          .then(data => setMandiComparisons(data.mandiComparisons || []));

        fetch(`/api/price-forecast?crop=${encodeURIComponent(selectedCrop)}`)
          .then(res => res.json())
          .then(data => setForecastData(data.forecast));
      }, [selectedCrop]);

      const renderSvgChart = () => {
        if (!forecastData || !forecastData.prices) return null;
        const prices = forecastData.prices;
        const minP = Math.min(...prices);
        const maxP = Math.max(...prices);
        const rangeP = (maxP - minP) || 1;

        const points = prices.map((p, idx) => ({
          cx: 35 + idx * 72,
          cy: 120 - ((p - minP) / rangeP) * 90,
          price: p,
          day: forecastData.days[idx]
        }));

        const pathD = `M ${points.map(pt => `${pt.cx} ${pt.cy}`).join(' L ')}`;

        return (
          <svg class="w-full h-48 overflow-visible" viewBox="0 0 500 150">
            <line x1="10" y1="30" x2="490" y2="30" stroke="#E5E7EB" stroke-dasharray="4" />
            <line x1="10" y1="120" x2="490" y2="120" stroke="#E5E7EB" stroke-dasharray="4" />
            <path d={pathD} fill="none" stroke="#1B5E3B" stroke-width="4.5" />
            {points.map((pt, idx) => (
              <g key={idx}>
                <circle cx={pt.cx} cy={pt.cy} r="6" fill="#1B5E3B" stroke="#FFF" stroke-width="2" />
                <text x={pt.cx} y={pt.cy - 12} font-size="11" font-weight="800" text-anchor="middle">₹{pt.price}</text>
              </g>
            ))}
          </svg>
        );
      };

      return (
        <div class="max-w-7xl mx-auto p-6 space-y-8">
          <header class="flex justify-between items-center bg-white p-6 rounded-3xl border shadow-sm">
            <h1 class="text-2xl font-black text-agri-600">🌾 KrishiSetu Market Dashboard</h1>
            <div class="flex gap-2">
              <button onClick={() => setCurrentRole('farmer')} class={`px-4 py-2 rounded-full font-bold ${currentRole==='farmer'?'bg-agri-600 text-white':'bg-gray-100'}`}>🧑‍🌾 Farmer</button>
              <button onClick={() => setCurrentRole('buyer')} class={`px-4 py-2 rounded-full font-bold ${currentRole==='buyer'?'bg-agri-600 text-white':'bg-gray-100'}`}>🏬 Buyer</button>
            </div>
          </header>

          <div class="bg-white p-8 rounded-3xl border shadow-lg space-y-6">
            <h2 class="text-2xl font-black">🧠 AI 30-Day Price Forecast</h2>
            {renderSvgChart()}
          </div>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
