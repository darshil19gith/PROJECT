<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>KrishiSetu | Login & Onboarding Portal</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Noto+Sans+Devanagari:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Inter', 'Noto Sans Devanagari', sans-serif; background-color: #FAFAF7; color: #1C241E; }
    .container { max-width: 760px; margin: 40px auto; padding: 20px; }
    .card { background: #FFF; border-radius: 24px; padding: 36px; border: 1px solid #D9DFD7; box-shadow: 0 20px 40px rgba(27,94,59,0.1); }
    .form-group { margin-bottom: 20px; }
    .form-input { width: 100%; padding: 14px; border: 1.5px solid #D9DFD7; border-radius: 12px; }
    .btn-submit { width: 100%; background: #F2B01E; color: #211b06; font-weight: 800; padding: 16px; border-radius: 99px; border: none; font-size: 1.1rem; cursor: pointer; }
  </style>
</head>
<body>
  <div class="container">
    <div class="card">
      <h1 id="registerTitle" style="text-align: center; margin-bottom: 8px;">Join KrishiSetu Platform</h1>
      <p style="text-align: center; color: #536458; margin-bottom: 24px;">Complete your onboarding & KYC verification</p>

      <form id="registerForm" onsubmit="executeRegistrationAndNavigate(event)">
        <div class="form-group">
          <label style="font-weight: 700;">Full Name / Organization</label>
          <input type="text" class="form-input" id="regName" value="Ramesh Patil" required>
        </div>
        <div class="form-group">
          <label style="font-weight: 700;">Select Profile Role</label>
          <select class="form-input" id="regRole">
            <option value="farmer">🧑‍🌾 Farmer / FPO</option>
            <option value="buyer">🏬 Buyer (Trader / Wholesaler)</option>
            <option value="service-provider">🚚 Service Provider</option>
          </select>
        </div>
        <div class="form-group">
          <label style="font-weight: 700;">Upload KYC Document (Aadhaar / GST / FPO License)</label>
          <input type="file" class="form-input" id="kycFile" accept="image/*,.pdf">
        </div>
        <button type="submit" class="btn-submit" id="btnFinishReg">Complete Registration & Enter Dashboard →</button>
      </form>
    </div>
  </div>

  <script>
    function executeRegistrationAndNavigate(e) {
      if (e && e.preventDefault) e.preventDefault();
      const role = document.getElementById('regRole').value || 'farmer';
      const name = document.getElementById('regName').value || 'Ramesh Patil';
      
      const btn = document.getElementById('btnFinishReg');
      btn.disabled = true;
      btn.innerHTML = '⌛ Entering Dashboard...';

      localStorage.setItem('krishisetu_user', JSON.stringify({ role, name, isLoggedIn: true }));
      
      try {
        fetch('/api/register', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ name, role, kycStatus: 'verified' })
        });
      } catch(err){}

      setTimeout(() => {
        window.location.href = `/dashboard?role=${role}`;
      }, 150);
    }
  </script>
</body>
</html>
